name: Mobile CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: dart format --output=show --set-exit-if-changed lib test
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test

  android-apk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner without changing app sources
        working-directory: apps/mobile
        run: |
          runner_dir=$(mktemp -d)
          flutter create --platforms=android --project-name sport_team_manager --org com.sportteammanager --no-pub "$runner_dir"
          cp -R "$runner_dir/android" ./android
          sed -i 's/com\.sportteammanager\.sport_team_manager/com.sportteammanager.app/g' \
            android/app/build.gradle.kts \
            android/app/src/main/kotlin/com/sportteammanager/sport_team_manager/MainActivity.kt
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sport-team-manager-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  web-preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web runner without changing app sources
        working-directory: apps/mobile
        run: |
          runner_dir=$(mktemp -d)
          flutter create --platforms=web --project-name sport_team_manager --no-pub "$runner_dir"
          cp -R "$runner_dir/web" ./web
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
      - working-directory: apps/mobile
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-preview
          path: apps/mobile/build/web
          if-no-files-found: error
          retention-days: 7
