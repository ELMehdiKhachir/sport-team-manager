services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sport_team_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sport_team_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sport_team_manager_postgres:/var/lib/postgresql/data

volumes:
  sport_team_manager_postgres:

